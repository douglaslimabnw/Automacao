<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Dark Vertical Gradient Background -->
    <linearGradient id="shortsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070C" />
      <stop offset="20%" stop-color="#0B0E17" />
      <stop offset="80%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#05070C" />
    </linearGradient>

    <!-- Top & Bottom UI Fade Overlays -->
    <linearGradient id="topFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bottomFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0B0E17" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0" />
    </linearGradient>

    <!-- Text Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1080" height="1920" fill="url(#shortsBg)" />

  <!-- Ambient Glows -->
  <circle cx="540" cy="960" r="400" fill="#7C5CFF" opacity="0.12" />

  <!-- YouTube UI Overlay Gradients (Top & Bottom protections) -->
  <rect width="1080" height="280" fill="url(#topFade)" />
  <rect y="1520" width="1080" height="400" fill="url(#bottomFade)" />

  <!-- TOP HEADER BRANDING (Safe from top status bar) -->
  <g transform="translate(540, 140)" filter="url(#shadow)">
    <!-- Brand Pill -->
    <rect x="-240" y="-35" width="480" height="70" rx="35" fill="#141A2E" stroke="#7C5CFF" stroke-width="2" />

    <!-- Mini Synapse Icon -->
    <circle cx="-180" cy="0" r="16" fill="#7C5CFF" />
    <circle cx="-180" cy="0" r="6" fill="#FBBF24" />

    <!-- Channel Name -->
    <text x="20" y="10" text-anchor="middle" fill="#F5F7FF" font-family="'Montserrat', sans-serif" font-weight="900" font-size="24" letter-spacing="2">
      A CADA DIA, <tspan fill="#FBBF24">APRENDER</tspan>
    </text>
  </g>

  <!-- CENTRAL CONTENT & CAPTIONS SAFE ZONE (y: 350 to 1450) -->
  <g id="captions-safe-zone">
    <!-- Safe Zone Outline (For Template Preview) -->
    <rect x="80" y="380" width="920" height="1060" fill="none" stroke="#7C5CFF" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.3" />

    <!-- Sample Central Hook Title Overlay -->
    <g transform="translate(540, 680)" text-anchor="middle" filter="url(#shadow)">
      <rect x="-380" y="-60" width="760" height="110" rx="16" fill="#141A2E" stroke="#FBBF24" stroke-width="3" />
      <text x="0" y="12" fill="#FBBF24" font-family="'Montserrat', sans-serif" font-weight="900" font-size="44" letter-spacing="1">
        7 SINAIS CORPORAIS 🧠
      </text>
    </g>

    <!-- Sample Dynamic Subtitle Area (Center Screen) -->
    <g transform="translate(540, 1100)" text-anchor="middle" filter="url(#shadow)">
      <text x="0" y="0" fill="#F5F7FF" font-family="'Montserrat', sans-serif" font-weight="900" font-size="52" letter-spacing="1">
        QUANDO ALGUÉM
      </text>
      <text x="0" y="70" fill="#EF4444" font-family="'Montserrat', sans-serif" font-weight="900" font-size="64" letter-spacing="2">
        MENTE PRA VOCÊ
      </text>
    </g>
  </g>

  <!-- BOTTOM CALL-TO-ACTION FRAME (Above YouTube Shorts UI) -->
  <g transform="translate(540, 1660)" text-anchor="middle" filter="url(#shadow)">
    <!-- Subscribe Pill CTA -->
    <rect x="-260" y="-45" width="520" height="90" rx="45" fill="#7C5CFF" />
    <text x="0" y="12" fill="#F5F7FF" font-family="'Montserrat', sans-serif" font-weight="900" font-size="28" letter-spacing="2">
      🔔 INSCREVA-SE PARA MAIS
    </text>
  </g>
</svg>

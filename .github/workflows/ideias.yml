name: Repor a fila

# Todo domingo 09:00 UTC (= 06:00 em Brasília): pede ao agente o próximo lote
# de episódios e abre um PR só com fila.json — você revisa os títulos e briefs
# em 2 minutos e o merge libera a produção da semana.
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      n:
        description: "Quantos episódios propor"
        default: "4"

permissions:
  contents: write
  pull-requests: write

jobs:
  ideias:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install -g @anthropic-ai/claude-code || echo "cli claude indisponível"

      - name: Gerar ideias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m fabrica ideias --n "${{ inputs.n || 4 }}" --provedor claude
          python -m fabrica fila

      - name: Abrir PR com a fila nova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "fabrica[bot]"
          git config user.email "fabrica@users.noreply.github.com"
          if git diff --quiet fila.json; then
            echo "fila sem mudanças"; exit 0
          fi
          BR="fila/$(date -u +%Y-%m-%d)"
          git checkout -b "$BR"
          git add fila.json
          git commit -m "fila: propostas de episódio para $(date -u +%F)"
          git push -u origin "$BR"
          gh pr create --title "Fila: próximos episódios" \
            --body "Lote gerado pelo agente. Revise títulos e briefs; o merge libera a produção semanal." \
            --base main --head "$BR"
